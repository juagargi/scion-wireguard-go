# Compose project name: wgexp-monitoring (distinct from hummbwtester's, which uses 8090/3000).
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: wgexp-prometheus
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=180d"
      - "--web.listen-address=:${PROMETHEUS_PORT:-8091}"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../gen/prometheus:/etc/prometheus/targets:ro
      - wgexp-prometheus-data:/prometheus

  grafana:
    image: grafana/grafana-oss:latest
    container_name: wgexp-grafana
    depends_on:
      - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROMETHEUS_PORT: "${PROMETHEUS_PORT:-8091}"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - wgexp-grafana-data:/var/lib/grafana

volumes:
  wgexp-prometheus-data:
  wgexp-grafana-data:
